<!-- Search Bar & Active Filter Banner -->
<div class="border border-[var(--border-color)] bg-[var(--bg-surface)] p-3 shadow-sm font-mono-bios">
  <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
    <!-- Search Input -->
    <div class="relative flex-1">
      <svg lucideSearch class="w-4 h-4 absolute left-2.5 top-2.5 text-[var(--text-dim)] pointer-events-none"></svg>
      <input
        id="landing-search-input"
        type="text"
        [value]="searchQuery()"
        (input)="searchChange.emit($any($event.target).value)"
        placeholder="Search engineering logs, keywords, tags, or concepts [F2]..."
        class="w-full bg-[var(--bg-canvas)] text-[var(--text-primary)] pl-8 pr-8 py-2 text-xs border border-[var(--border-color)] focus:outline-none focus:border-[var(--accent-terminal)] placeholder:text-[var(--text-dim)]"
      />
      @if (searchQuery()) {
        <button
          type="button"
          (click)="clearSearch.emit()"
          class="absolute right-2 top-2 text-xs text-[var(--text-dim)] hover:text-[var(--text-primary)] cursor-pointer"
          title="Clear search"
          aria-label="Clear search input"
        >
          ✕
        </button>
      }
    </div>

    <!-- Counter & Reset Controls -->
    <div class="flex items-center gap-2 text-xs text-[var(--text-dim)] shrink-0 justify-between sm:justify-start">
      <span class="font-mono">
        ENTRIES: <strong class="text-[var(--text-primary)]">{{ totalEntries() }}</strong>
      </span>
      @if (hasActiveFilters()) {
        <button
          type="button"
          (click)="clearAllFilters.emit()"
          class="flex items-center gap-1 px-2 py-1 bg-[var(--bg-canvas)] border border-[var(--border-color)] hover:border-[var(--accent-terminal)] text-[var(--text-primary)] text-[11px] cursor-pointer"
          title="Reset all active filters"
        >
          <svg lucideX class="w-3 h-3"></svg>
          <span>RESET</span>
        </button>
      }
    </div>
  </div>

  <!-- Active Filter Badges -->
  @if (hasActiveFilters()) {
    <div class="flex flex-wrap items-center gap-1.5 mt-2.5 pt-2.5 border-t border-[var(--border-subtle)] text-[11px]">
      <span class="text-[var(--text-dim)] flex items-center gap-1">
        <svg lucideFilter class="w-3 h-3"></svg>
        <span>FILTERS:</span>
      </span>

      @if (selectedCategory()) {
        <span class="inline-flex items-center gap-1 px-2 py-0.5 bg-[var(--accent-terminal)]/10 text-[var(--accent-terminal)] border border-[var(--accent-terminal)]">
          <span>Category: {{ selectedCategory() }}</span>
          <button
            type="button"
            (click)="clearCategory.emit()"
            class="hover:opacity-75 cursor-pointer ml-1"
            aria-label="Remove category filter"
          >
            ×
          </button>
        </span>
      }

      @if (selectedMonth()) {
        <span class="inline-flex items-center gap-1 px-2 py-0.5 bg-[var(--accent-blue)]/10 text-[var(--accent-blue)] border border-[var(--accent-blue)]">
          <span>Month: {{ selectedMonth() }}</span>
          <button
            type="button"
            (click)="clearMonth.emit()"
            class="hover:opacity-75 cursor-pointer ml-1"
            aria-label="Remove month filter"
          >
            ×
          </button>
        </span>
      }

      @if (searchQuery()) {
        <span class="inline-flex items-center gap-1 px-2 py-0.5 bg-[var(--accent-orange)]/10 text-[var(--accent-orange)] border border-[var(--accent-orange)]">
          <span>Query: "{{ searchQuery() }}"</span>
          <button
            type="button"
            (click)="clearSearch.emit()"
            class="hover:opacity-75 cursor-pointer ml-1"
            aria-label="Remove search query"
          >
            ×
          </button>
        </span>
      }
    </div>
  }
</div>
