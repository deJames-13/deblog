<aside
  id="admin-desktop-sidebar"
  aria-label="Admin Navigation Sidebar"
  class="hidden lg:flex flex-col gap-3 font-mono-bios select-none w-full"
>
  <!-- 1. Administrator Identity Card -->
  <div class="border border-[var(--border-color)] bg-[var(--bg-surface)] p-3 space-y-2 shadow-xs">
    <div class="flex items-center gap-2.5">
      <app-author-avatar
        [name]="profile().name"
        [avatarUrl]="profile().avatar_url"
        size="md"
        class="shrink-0"
      />
      <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between gap-1">
          <h3 class="font-bold text-xs truncate text-[var(--text-primary)]">
            {{ profile().name }}
          </h3>
        </div>
        <div class="flex items-center gap-1.5 mt-0.5">
          <span class="px-1 py-0.2 bg-[var(--accent-fkey)]/10 border border-[var(--accent-fkey)] text-[var(--accent-fkey)] font-bold text-[9px] uppercase tracking-wider">
            ADMIN
          </span>
          <span class="inline-flex items-center gap-1 text-[9px] text-[var(--accent-terminal)]">
            <span class="w-1.5 h-1.5 rounded-full bg-[var(--accent-terminal)] animate-pulse"></span>
            ACTIVE
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. Navigation Items Section -->
  <div class="border border-[var(--border-color)] bg-[var(--bg-surface)] p-2 shadow-xs space-y-1">
    <div class="px-2 py-1 text-[9px] text-[var(--text-dim)] uppercase tracking-wider border-b border-[var(--border-subtle)] mb-1 flex items-center justify-between">
      <span>SECTIONS</span>
      <span class="text-[8px] text-[var(--accent-terminal)]">[F8]</span>
    </div>

    <nav aria-label="Admin Sections" class="space-y-0.5">
      @for (item of adminNavItems(); track item.id) {
        @let isActive = adminTab() === item.id;
        <button
          type="button"
          [id]="'admin-sidebar-nav-' + item.id"
          (click)="setAdminTab(item.id)"
          class="w-full flex items-center justify-between px-2.5 py-1.5 border text-xs text-left cursor-pointer transition-colors"
          [class.bg-[var(--accent-terminal)]]="isActive"
          [class.text-[var(--accent-terminal-contrast)]]="isActive"
          [class.border-[var(--accent-terminal)]]="isActive"
          [class.font-bold]="isActive"
          [class.bg-[var(--bg-canvas)]]="!isActive"
          [class.text-[var(--text-muted)]]="!isActive"
          [class.border-[var(--border-subtle)]]="!isActive"
          [class.hover:border-[var(--border-color)]]="!isActive"
          [class.hover:text-[var(--text-primary)]]="!isActive"
          [class.hover:bg-[var(--bg-highlight)]]="!isActive"
          [appTooltip]="item.desc"
          [attr.aria-label]="item.label"
          [attr.aria-current]="isActive ? 'page' : null"
        >
          <div class="flex items-center gap-2 min-w-0">
            @switch (item.id) {
              @case ('dashboard') {
                <svg lucideLayoutDashboard class="w-3.5 h-3.5 shrink-0"></svg>
              }
              @case ('posts') {
                <svg lucideFileText class="w-3.5 h-3.5 shrink-0"></svg>
              }
              @case ('users') {
                <svg lucideUsers class="w-3.5 h-3.5 shrink-0"></svg>
              }
              @case ('comments') {
                <svg lucideMessageSquare class="w-3.5 h-3.5 shrink-0"></svg>
              }
              @case ('media') {
                <svg lucideImage class="w-3.5 h-3.5 shrink-0"></svg>
              }
              @case ('settings') {
                <svg lucideSettings class="w-3.5 h-3.5 shrink-0"></svg>
              }
            }
            <span class="truncate">{{ item.label }}</span>
          </div>

          @if (item.badge) {
            <span
              class="px-1.5 py-0.2 text-[9px] font-bold shrink-0 ml-1 border border-black/20"
              [class]="
                item.badgeColor
                  ? item.badgeColor
                  : isActive
                  ? 'bg-black text-[var(--accent-terminal)]'
                  : 'bg-[var(--accent-terminal)] text-[var(--accent-terminal-contrast)]'
              "
            >
              {{ item.badge }}
            </span>
          }
        </button>
      }
    </nav>
  </div>

  <!-- 3. System Snapshot Card -->
  <div class="border border-[var(--border-color)] bg-[var(--bg-surface)] p-2.5 shadow-xs space-y-2 text-xs">
    <div class="flex items-center justify-between text-[9px] text-[var(--text-dim)] uppercase tracking-wider border-b border-[var(--border-subtle)] pb-1">
      <span class="flex items-center gap-1">
        <svg lucideActivity class="w-3 h-3 text-[var(--accent-terminal)]"></svg>
        <span>TELEMETRY</span>
      </span>
      <span>SYS.OK</span>
    </div>

    <div class="grid grid-cols-2 gap-1.5 text-[10px]">
      <div class="p-1.5 border border-[var(--border-subtle)] bg-[var(--bg-canvas)]">
        <div class="text-[9px] text-[var(--text-dim)] uppercase">Published</div>
        <div class="font-bold text-[var(--accent-terminal)] text-xs mt-0.5">
          {{ publishedPosts().length }}
        </div>
      </div>

      <div class="p-1.5 border border-[var(--border-subtle)] bg-[var(--bg-canvas)]">
        <div class="text-[9px] text-[var(--text-dim)] uppercase">Drafts</div>
        <div class="font-bold text-[var(--accent-orange)] text-xs mt-0.5">
          {{ draftPostsCount() }}
        </div>
      </div>

      <div class="p-1.5 border border-[var(--border-subtle)] bg-[var(--bg-canvas)] col-span-2">
        <div class="text-[9px] text-[var(--text-dim)] uppercase">Total Reads</div>
        <div class="font-bold text-[var(--text-primary)] text-xs mt-0.5">
          {{ totalViews().toLocaleString() }} views
        </div>
      </div>
    </div>
  </div>

  <!-- 4. Quick Actions -->
  <div class="space-y-1.5">
    <button
      type="button"
      (click)="navigateToLanding()"
      class="w-full flex items-center justify-center gap-1.5 p-2 bg-[var(--bg-surface)] border border-[var(--border-color)] hover:border-[var(--accent-terminal)] text-[var(--text-primary)] text-xs cursor-pointer transition-colors"
      appTooltip="Return to Public View [F1]"
      tooltipPosition="top"
    >
      <svg lucideExternalLink class="w-3.5 h-3.5 text-[var(--accent-terminal)]"></svg>
      <span>PUBLIC VIEW [F1]</span>
    </button>

    <button
      type="button"
      (click)="logout()"
      class="w-full flex items-center justify-center gap-1.5 p-2 bg-[var(--bg-surface)] border border-[var(--accent-fkey)] text-[var(--accent-fkey)] hover:bg-[var(--accent-fkey)] hover:text-white text-xs cursor-pointer transition-colors"
      appTooltip="Terminate Administrator Session [F8]"
      tooltipPosition="top"
    >
      <svg lucideLogOut class="w-3.5 h-3.5"></svg>
      <span>TERMINATE SESSION</span>
    </button>
  </div>
</aside>
