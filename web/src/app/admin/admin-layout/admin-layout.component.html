<div id="admin-master-container" class="font-mono-bios w-full flex flex-col lg:flex-row gap-4 items-start">
  <!-- Desktop Admin Sidebar: visible on desktop (lg+), hidden on tablet/mobile (< lg) -->
  <app-admin-sidebar class="hidden lg:flex flex-col w-56 xl:w-64 shrink-0" />

  <!-- Admin Tab Viewport (Full width workspace taking remainder) -->
  <section id="admin-view-content" class="flex-1 w-full min-w-0">
    @switch (blogService.adminTab()) {
      @case ('dashboard') {
        <app-dashboard-home />
      }
      @case ('home') {
        <app-dashboard-home />
      }
      @case ('posts') {
        <app-admin-posts />
      }
      @case ('users') {
        <app-admin-users />
      }
      @case ('comments') {
        <app-admin-comments />
      }
      @case ('media') {
        <app-admin-media />
      }
      @case ('settings') {
        <app-admin-settings />
      }
    }
  </section>
</div>
