<div
  id="admin-auth-screen"
  class="w-full flex items-center justify-center py-16 px-3 font-mono-bios text-xs"
>
  <div class="w-full max-w-md bg-[var(--bg-surface)] border border-[var(--border-color)] text-[var(--text-primary)] shadow-xl">
    <!-- BIOS Header -->
    <div class="px-3 py-2 bg-[var(--bg-canvas)] border-b border-[var(--border-color)] flex items-center justify-between text-xs">
      <div class="flex items-center gap-2">
        <svg lucideLock class="w-4 h-4 text-[var(--accent-fkey)]" aria-hidden="true"></svg>
        <h2 class="font-bold uppercase tracking-wider">
          ADMIN CONSOLE
        </h2>
      </div>
      <button
        type="button"
        (click)="goBack()"
        class="text-[var(--text-dim)] hover:text-[var(--text-primary)] focus:outline-none focus-visible:ring-1 focus-visible:ring-[var(--accent-terminal)] flex items-center gap-1.5 cursor-pointer transition-colors px-1 py-0.5"
        aria-label="Go back to landing page"
      >
        <svg lucideArrowLeft class="w-3.5 h-3.5" aria-hidden="true"></svg>
        <span>Go Back</span>
      </button>
    </div>

    <!-- Auth Body -->
    <form (submit)="handleLogin($event)" class="p-6 space-y-4" [attr.aria-busy]="isSubmitting()">
      <div class="p-3 border border-[var(--border-subtle)] bg-[var(--bg-canvas)]">
        <div class="flex items-center gap-1.5 font-bold text-[var(--accent-terminal)] uppercase text-[11px]">
          <svg lucideTerminal class="w-3.5 h-3.5" aria-hidden="true"></svg>
          <span>AUTHORIZED PERSONNEL ONLY</span>
        </div>
        <p class="text-[10px] text-[var(--text-dim)] mt-1">
          Authenticate using your verified administrator credentials.
        </p>
      </div>

      <!-- Username / Email field -->
      <div>
        <label for="admin-auth-username" class="block text-[10px] uppercase text-[var(--text-dim)] tracking-wider mb-1.5 font-semibold">
          Author Email / Username
        </label>
        <div class="relative">
          <svg lucideUser class="w-4 h-4 absolute left-2.5 top-2.5 text-[var(--text-dim)]" aria-hidden="true"></svg>
          <input
            id="admin-auth-username"
            type="text"
            required
            autocomplete="username"
            [disabled]="isSubmitting()"
            placeholder="author@example.com or dej"
            [value]="username()"
            (input)="username.set($any($event.target).value)"
            class="w-full bg-[var(--bg-canvas)] text-[var(--text-primary)] pl-8 pr-3 py-2 text-xs border border-[var(--border-color)] focus:outline-none focus:border-[var(--accent-terminal)] focus:ring-1 focus:ring-[var(--accent-terminal)] placeholder:text-[var(--text-dim)] disabled:opacity-50"
          />
        </div>
      </div>

      <!-- Password field -->
      <div>
        <label for="admin-auth-password" class="block text-[10px] uppercase text-[var(--text-dim)] tracking-wider mb-1.5 font-semibold">
          Security Key / Password
        </label>
        <div class="relative">
          <svg lucideKey class="w-4 h-4 absolute left-2.5 top-2.5 text-[var(--text-dim)]" aria-hidden="true"></svg>
          <input
            id="admin-auth-password"
            type="password"
            required
            autocomplete="current-password"
            [disabled]="isSubmitting()"
            placeholder="Enter security key or password..."
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            class="w-full bg-[var(--bg-canvas)] text-[var(--text-primary)] pl-8 pr-3 py-2 text-xs border border-[var(--border-color)] focus:outline-none focus:border-[var(--accent-terminal)] focus:ring-1 focus:ring-[var(--accent-terminal)] placeholder:text-[var(--text-dim)] disabled:opacity-50"
          />
        </div>
      </div>

      <!-- Error State -->
      @if (errorMsg()) {
        <div
          role="alert"
          class="p-2.5 border border-red-500/40 bg-red-500/10 text-red-400 text-[11px] flex items-start gap-2 animate-fadeIn"
        >
          <span class="font-bold shrink-0">[ERR]</span>
          <span class="flex-1">{{ errorMsg() }}</span>
        </div>
      }

      <div class="pt-2">
        <button
          type="submit"
          [disabled]="isSubmitting() || !username() || !password()"
          class="w-full px-4 py-2.5 font-bold uppercase tracking-wider border border-[var(--accent-terminal)] bg-[var(--accent-terminal)] text-[var(--accent-terminal-contrast)] hover:opacity-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-[var(--accent-terminal)] cursor-pointer text-xs transition-opacity disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
        >
          @if (isSubmitting()) {
            <svg lucideLoader class="w-3.5 h-3.5 animate-spin" aria-hidden="true"></svg>
            <span>Verifying Credentials...</span>
          } @else {
            <span>Authenticate Session</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
